<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="48%" stop-color="#0d0c0b"/>
      <stop offset="100%" stop-color="#19150f"/>
    </linearGradient>
    <radialGradient id="goldGlow1" cx="76%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#f2d59c" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#c9a55c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="62%" cy="76%" r="36%">
      <stop offset="0%" stop-color="#e8c783" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0cc" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#d4af6a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c6234" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="flute" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5dfb0" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06070a" stop-opacity="1"/>
      <stop offset="45%" stop-color="#06070a" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#06070a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#goldGlow1)"/>
  <rect width="1600" height="900" fill="url(#goldGlow2)"/>

  <!-- Fluted Smoked Glass Architectural Ribbing on Right Half -->
  <g opacity="0.85">
    <rect x="860" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="900" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="940" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="980" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1020" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1060" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1100" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1140" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1180" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1220" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1260" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1300" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1340" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1380" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1420" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1460" y="0" width="28" height="900" fill="url(#flute)"/>
    <rect x="1500" y="0" width="28" height="900" fill="url(#flute)"/>
  </g>

  <!-- Minimalist Luxury Salon Arched Mirror & Brass Light Sculpture -->
  <g transform="translate(960, 110)">
    <path d="M 80 790 L 80 230 A 210 210 0 0 1 500 230 L 500 790" fill="#0c0b09" fill-opacity="0.58" stroke="url(#archStroke)" stroke-width="2.5"/>
    <path d="M 110 790 L 110 235 A 180 180 0 0 1 470 235 L 470 790" fill="none" stroke="#e9cb8c" stroke-opacity="0.28" stroke-width="1"/>
    <!-- Silk Light Reflection Curve -->
    <path d="M 125 690 C 190 500, 320 420, 465 215" fill="none" stroke="#fff3d6" stroke-opacity="0.32" stroke-width="48" stroke-linecap="round"/>
    <path d="M 180 730 C 260 560, 350 470, 480 320" fill="none" stroke="#d4af6a" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
    <!-- Minimal Editorial Halo Ring -->
    <circle cx="290" cy="280" r="115" fill="none" stroke="url(#archStroke)" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="290" cy="280" r="145" fill="none" stroke="#d4af6a" stroke-width="0.7" stroke-opacity="0.28"/>
  </g>

  <!-- Subtle Horizontal Champagne Horizon Line -->
  <line x1="780" y1="690" x2="1560" y2="690" stroke="#e8ca8e" stroke-opacity="0.24" stroke-width="1"/>

  <!-- Deep Left Obsidian Negative Space Mask -->
  <rect width="1600" height="900" fill="url(#leftMask)"/>
</svg>
