<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="55%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#131722"/>
    </linearGradient>
    <radialGradient id="silverBeam" cx="78%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#64748b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="monolith" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="35%" stop-color="#94a3b8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="nLeftMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609" stop-opacity="1"/>
      <stop offset="44%" stop-color="#050609" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#050609" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#nbg)"/>
  <rect width="1600" height="900" fill="url(#silverBeam)"/>

  <!-- Minimalist Brutalist Digital Archive Monoliths & Linear Shelf Lighting -->
  <g stroke="#cbd5e1" stroke-opacity="0.14" stroke-width="1">
    <line x1="720" y1="180" x2="1580" y2="180"/>
    <line x1="760" y1="340" x2="1580" y2="340"/>
    <line x1="800" y1="500" x2="1580" y2="500"/>
    <line x1="840" y1="660" x2="1580" y2="660"/>
    <line x1="920" y1="0" x2="920" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="1320" y1="0" x2="1320" y2="900"/>
    <line x1="1500" y1="0" x2="1500" y2="900"/>
  </g>

  <!-- Vertical Architectural Light Pillars -->
  <g>
    <rect x="920" y="90" width="160" height="760" fill="url(#monolith)" stroke="#e2e8f0" stroke-opacity="0.18"/>
    <rect x="1120" y="45" width="160" height="810" fill="url(#monolith)" stroke="#ffffff" stroke-opacity="0.24"/>
    <rect x="1320" y="130" width="150" height="720" fill="url(#monolith)" stroke="#cbd5e1" stroke-opacity="0.16"/>
    <!-- Razor LED Shelf Accents -->
    <rect x="945" y="180" width="110" height="2" fill="#f8fafc" fill-opacity="0.65"/>
    <rect x="1145" y="180" width="110" height="2" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="1145" y="340" width="110" height="2" fill="#e2e8f0" fill-opacity="0.65"/>
    <rect x="1145" y="500" width="110" height="2" fill="#e11d2e" fill-opacity="0.75"/>
    <rect x="1345" y="340" width="100" height="2" fill="#f8fafc" fill-opacity="0.55"/>
    <rect x="1345" y="500" width="100" height="2" fill="#cbd5e1" fill-opacity="0.45"/>
  </g>

  <!-- Crisp Perspective Floor Line -->
  <line x1="700" y1="780" x2="1600" y2="780" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <rect width="1600" height="900" fill="url(#nLeftMask)"/>
</svg>
